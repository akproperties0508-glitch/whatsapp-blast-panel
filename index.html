<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WhatsApp Blast Dashboard</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

.header{
  background:#075e54;
  color:white;
  padding:18px 25px;
  font-size:24px;
  font-weight:bold;
}

.container{
  max-width:1100px;
  margin:25px auto;
  padding:0 15px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
}

label{
  display:block;
  margin:12px 0 6px;
  font-weight:bold;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  border:1px solid #ccd3dc;
  border-radius:8px;
  font-size:15px;
}

textarea{
  min-height:160px;
  resize:vertical;
}

button{
  border:0;
  padding:12px 18px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  margin-top:12px;
}

.primary{
  background:#075e54;
  color:white;
}

.secondary{
  background:#e8eef5;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:20px;
}

.stat{
  background:white;
  padding:18px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.stat b{
  display:block;
  font-size:25px;
  margin-top:5px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,
td{
  padding:9px;
  border-bottom:1px solid #eee;
  text-align:left;
}

.preview{
  background:#e9f8ef;
  padding:15px;
  border-radius:10px;
  white-space:pre-wrap;
  min-height:100px;
}

.status{
  margin-top:12px;
  padding:12px;
  border-radius:8px;
  background:#f1f5f9;
  font-size:14px;
}

.note{
  font-size:13px;
  color:#667085;
  margin-top:8px;
}

@media(max-width:750px){

  .grid{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<div class="header">
  WhatsApp Blast Dashboard
</div>

<div class="container">

  <div class="stats">

    <div class="stat">
      Contacts
      <b id="total">0</b>
    </div>

    <div class="stat">
      Selected
      <b id="selected">0</b>
    </div>

    <div class="stat">
      Ready
      <b id="ready">0</b>
    </div>

  </div>


  <div class="grid">


    <!-- CONTACT LIST -->

    <div class="card">

      <h2>📊 Contact List</h2>

      <label>Upload CSV File</label>

      <input
        type="file"
        id="csvFile"
        accept=".csv"
      >

      <div class="note">
        CSV format: Name,Phone
      </div>


      <label>Or Add Number Manually</label>

      <input
        id="manualPhone"
        placeholder="Example: 919876543210"
      >

      <button
        class="secondary"
        onclick="addNumber()"
      >
        + Add Number
      </button>


      <table>

        <thead>

          <tr>
            <th>#</th>
            <th>Phone</th>
            <th>Status</th>
          </tr>

        </thead>

        <tbody id="contactTable"></tbody>

      </table>

    </div>



    <!-- MESSAGE COMPOSER -->

    <div class="card">

      <h2>💬 Message Composer</h2>


      <label>Project</label>

      <select id="project">

        <option>Project 1</option>
        <option>Project 2</option>
        <option>Project 3</option>
        <option>Project 4</option>
        <option>Project 5</option>

      </select>


      <label>Message</label>

      <textarea
        id="message"
        placeholder="Type your WhatsApp message here..."
        oninput="updatePreview()"
      ></textarea>


      <label>Preview</label>

      <div
        class="preview"
        id="preview"
      >
        Your message preview will appear here.
      </div>


      <button
        class="primary"
        onclick="sendWhatsAppMessage()"
      >
        Send WhatsApp Message
      </button>


      <div
        class="status"
        id="status"
      >
        Ready
      </div>


      <div class="note">
        First test is limited to one contact.
      </div>

    </div>

  </div>

</div>



<script>


/* =========================
   CONTACTS
========================= */

let contacts = [];


/* =========================
   CLOUDFLARE WORKER URL
========================= */

const API_URL =
"https://ak-properties-whatsapp-api.akproperties0508.workers.dev/";


/* =========================
   UPDATE STATS
========================= */

function updateStats(){

  document.getElementById("total").innerText =
    contacts.length;

  document.getElementById("selected").innerText =
    contacts.length;

  document.getElementById("ready").innerText =
    contacts.length;

}


/* =========================
   RENDER CONTACTS
========================= */

function renderContacts(){

  const table =
    document.getElementById("contactTable");

  table.innerHTML = "";


  contacts.forEach((phone,index)=>{

    const row =
      document.createElement("tr");


    row.innerHTML = `

      <td>${index + 1}</td>

      <td>${phone}</td>

      <td>Ready</td>

    `;


    table.appendChild(row);

  });


  updateStats();

}


/* =========================
   ADD MANUAL NUMBER
========================= */

function addNumber(){

  const input =
    document.getElementById("manualPhone");


  let phone =
    input.value.replace(/\D/g,'');


  if(!phone){

    alert(
      "Please enter a phone number."
    );

    return;

  }


  contacts.push(phone);

  input.value = "";

  renderContacts();

}


/* =========================
   CSV UPLOAD
========================= */

document
.getElementById("csvFile")
.addEventListener(
  "change",
  function(e){

    const file =
      e.target.files[0];


    if(!file){

      return;

    }


    const reader =
      new FileReader();


    reader.onload =
      function(event){

        const lines =
          event.target.result
          .split(/\r?\n/);


        contacts = [];


        lines.forEach(
          (line,index)=>{

            if(
              index === 0 &&
              line.toLowerCase()
              .includes("phone")
            ){

              return;

            }


            const parts =
              line.split(",");


            if(parts.length > 1){

              let phone =
                parts[1]
                .replace(/\D/g,'');


              if(phone){

                contacts.push(phone);

              }

            }
            else{

              let phone =
                line.replace(/\D/g,'');


              if(phone){

                contacts.push(phone);

              }

            }

          }
        );


        renderContacts();

      };


    reader.readAsText(file);

  }
);


/* =========================
   MESSAGE PREVIEW
========================= */

function updatePreview(){

  const message =
    document
    .getElementById("message")
    .value;


  document
  .getElementById("preview")
  .innerText =
    message ||
    "Your message preview will appear here.";

}


/* =========================
   STATUS
========================= */

function setStatus(message){

  document
  .getElementById("status")
  .innerText =
    message;

}


/* =========================
   SEND WHATSAPP MESSAGE
========================= */

async function sendWhatsAppMessage(){


  if(contacts.length === 0){

    alert(
      "Please add or upload a contact first."
    );

    return;

  }


  const message =
    document
    .getElementById("message")
    .value
    .trim();


  if(!message){

    alert(
      "Please enter a message."
    );

    return;

  }


  /*
    TEST MODE:
    ONLY FIRST CONTACT
  */

  const phone =
    contacts[0];


  setStatus(
    "Sending message..."
  );


  try{


    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            to:phone,

            message:message

          })

        }
      );


    const result =
      await response.json();


    console.log(
      "WhatsApp API Response:",
      result
    );


    if(response.ok){

      setStatus(
        "✅ Message sent successfully."
      );


      alert(
        "WhatsApp message sent successfully!"
      );

    }
    else{

      setStatus(
        "❌ WhatsApp API error."
      );


      alert(
        "WhatsApp API error. Check result."
      );

    }


  }
  catch(error){


    console.error(error);


    setStatus(
      "❌ Could not connect to API."
    );


    alert(
      "Could not connect to WhatsApp API."
    );

  }

}


/* =========================
   START
========================= */

updateStats();

</script>

</body>
</html>
